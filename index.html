<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Cat — Cozy Edition</title>
<style>
    html, body {
        margin: 0;
        min-height: 100%;
        background: #090b10;
        font-family: Arial, Helvetica, sans-serif;
    }
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }
    #game {
        width: min(480px, 94vw);
        height: auto;
        max-height: 94vh;
        aspect-ratio: 3 / 4;
        display: block;
        border: 1px solid #2d313b;
        border-radius: 16px;
        box-shadow: 0 18px 60px rgba(0,0,0,.55);
        background: #10141c;
        touch-action: none;
    }
</style>
</head>
<body>
<canvas id="game" width="480" height="640"></canvas>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 480, H = 640;
const GROUND = 590;

let state = "menu"; // menu, playing, paused, gameover
let score = 0;
let best = Number(localStorage.getItem("flappyCatBest") || 0);
let pipes = [];
let particles = [];
let clouds = [];
let stars = [];
let frame = 0;
let lastTime = 0;
let pipeTimer = 0;
let menuPulse = 0;
let muted = false;

const cat = new Image();
cat.src = "cat.png";

const player = {
    x: 112,
    y: 310,
    w: 58,
    h: 58,
    vy: 0,
    rotation: 0,
    squash: 1
};

// ---------- Audio: original cozy ambient loop ----------
let audioCtx = null;
let master = null;
let musicTimer = null;
let musicStep = 0;

function startAudio() {
    if (muted) return;
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        master = audioCtx.createGain();
        master.gain.value = 0.055;
        master.connect(audioCtx.destination);

        const chords = [
            [261.63, 329.63, 392.00], // C
            [220.00, 261.63, 329.63], // Am
            [174.61, 220.00, 261.63], // F
            [196.00, 246.94, 293.66]  // G
        ];

        musicTimer = setInterval(() => {
            if (!audioCtx || audioCtx.state !== "running" || muted || state === "paused") return;
            const chord = chords[musicStep % chords.length];
            chord.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.08 / (i + 1), audioCtx.currentTime + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);
                osc.connect(gain);
                gain.connect(master);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.9);
            });
            musicStep++;
        }, 1800);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
}

function sound(type) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(master);
    osc.type = "sine";

    if (type === "flap") {
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.08);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.09, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
        osc.start(now); osc.stop(now + 0.13);
    } else if (type === "score") {
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.16);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.07, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
        osc.start(now); osc.stop(now + 0.23);
    } else if (type === "crash") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.35);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        osc.start(now); osc.stop(now + 0.42);
    }
}

// ---------- World ----------
for (let i = 0; i < 28; i++) {
    stars.push({
        x: Math.random() * W,
        y: 25 + Math.random() * 330,
        r: Math.random() * 1.4 + 0.4,
        a: Math.random() * 0.45 + 0.2
    });
}
for (let i = 0; i < 7; i++) {
    clouds.push({
        x: Math.random() * W,
        y: 80 + Math.random() * 230,
        s: 0.65 + Math.random() * 0.65,
        a: 0.06 + Math.random() * 0.08
    });
}

function reset() {
    player.x = 112;
    player.y = 305;
    player.vy = 0;
    player.rotation = 0;
    player.squash = 1;
    score = 0;
    pipes = [];
    particles = [];
    pipeTimer = 0;
    frame = 0;
}

function startGame() {
    startAudio();
    reset();
    state = "playing";
    flap(false);
    createPipe();
}

function pauseGame() {
    if (state === "playing") state = "paused";
    else if (state === "paused") {
        state = "playing";
        startAudio();
    }
}

function gameOver() {
    state = "gameover";
    sound("crash");
    explode(player.x, player.y);
    if (score > best) {
        best = score;
        localStorage.setItem("flappyCatBest", best);
    }
}

function flap(playSound = true) {
    if (state === "menu") {
        startGame();
        return;
    }
    if (state === "gameover") {
        startGame();
        return;
    }
    if (state === "paused") return;

    player.vy = -8.2;
    player.squash = 0.88;
    if (playSound) sound("flap");
}

// ---------- Pipes ----------
function createPipe() {
    const gap = Math.max(142, 174 - score * 1.2);
    const topMin = 72;
    const topMax = GROUND - gap - 72;
    const top = topMin + Math.random() * (topMax - topMin);

    pipes.push({
        x: W + 30,
        w: 74,
        top,
        gap,
        passed: false
    });
}

function updatePipes(dt) {
    const speed = (3.15 + Math.min(score * 0.025, 1.4)) * dt / 16.67;

    for (const p of pipes) {
        p.x -= speed;

        if (!p.passed && p.x + p.w < player.x) {
            p.passed = true;
            score++;
            sound("score");
            if (score > best) {
                best = score;
                localStorage.setItem("flappyCatBest", best);
            }
        }
    }

    pipes = pipes.filter(p => p.x + p.w > -30);
}

function pipeCollision() {
    const l = player.x - 22;
    const r = player.x + 22;
    const t = player.y - 23;
    const b = player.y + 23;

    if (b >= GROUND || t <= 0) return true;

    for (const p of pipes) {
        const pr = p.x + p.w;
        const gapTop = p.top;
        const gapBottom = p.top + p.gap;

        if (r > p.x && l < pr && (t < gapTop || b > gapBottom)) {
            return true;
        }
    }
    return false;
}

// ---------- Particles ----------
function explode(x, y) {
    for (let i = 0; i < 34; i++) {
        const a = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
            x, y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            life: 1,
            size: 3 + Math.random() * 6,
            rot: Math.random() * 6,
            spin: -0.2 + Math.random() * 0.4
        });
    }
}

function updateParticles(dt) {
    const s = dt / 16.67;
    for (const p of particles) {
        p.x += p.vx * s;
        p.y += p.vy * s;
        p.vy += 0.18 * s;
        p.life -= 0.035 * s;
        p.rot += p.spin * s;
    }
    particles = particles.filter(p => p.life > 0);
}

// ---------- Drawing ----------
function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
}

function drawBackground() {
    // Cozy dark-liminal dusk gradient
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#101a29");
    g.addColorStop(0.5, "#172331");
    g.addColorStop(1, "#28333a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Moon glow
    const glow = ctx.createRadialGradient(365, 105, 5, 365, 105, 100);
    glow.addColorStop(0, "rgba(255,239,190,.34)");
    glow.addColorStop(1, "rgba(255,239,190,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(260, 0, 210, 210);

    ctx.fillStyle = "#f5e9c9";
    ctx.beginPath();
    ctx.arc(365, 105, 27, 0, Math.PI * 2);
    ctx.fill();

    // Stars
    for (const s of stars) {
        const twinkle = 0.72 + Math.sin(frame * 0.025 + s.x) * 0.28;
        ctx.fillStyle = `rgba(245,238,210,${s.a * twinkle})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }

    // Distant hazy clouds
    for (const c of clouds) {
        const x = ((c.x - frame * 0.12) % (W + 180)) - 90;
        ctx.fillStyle = `rgba(190,205,210,${c.a})`;
        ctx.beginPath();
        ctx.ellipse(x, c.y, 60 * c.s, 20 * c.s, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 42 * c.s, c.y - 9, 42 * c.s, 24 * c.s, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Distant silhouettes
    ctx.fillStyle = "rgba(8,13,19,.33)";
    for (let x = -20; x < W + 60; x += 54) {
        const h = 28 + ((x * 17) % 55 + 55) % 55;
        ctx.fillRect(x, GROUND - 52 - h, 38, h + 52);
        ctx.fillRect(x + 8, GROUND - 65 - h, 5, 8);
        ctx.fillRect(x + 22, GROUND - 42 - h, 5, 7);
    }

    // Warm distant horizon
    const horizon = ctx.createLinearGradient(0, GROUND - 85, 0, GROUND);
    horizon.addColorStop(0, "rgba(196,150,90,0)");
    horizon.addColorStop(1, "rgba(196,150,90,.12)");
    ctx.fillStyle = horizon;
    ctx.fillRect(0, GROUND - 90, W, 90);
}

function drawPipe(p) {
    const x = p.x, w = p.w;
    const bottomY = p.top + p.gap;

    // Pipe shadow
    ctx.fillStyle = "rgba(0,0,0,.28)";
    roundedRect(x + 7, 2, w, p.top, 5);
    roundedRect(x + 7, bottomY + 2, w, GROUND - bottomY, 5);

    // Main metal/stone-like pipe body
    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, "#27333a");
    grad.addColorStop(.18, "#53636a");
    grad.addColorStop(.42, "#829096");
    grad.addColorStop(.55, "#64747b");
    grad.addColorStop(1, "#263139");

    ctx.fillStyle = grad;
    roundedRect(x, 0, w, p.top, 4);
    roundedRect(x, bottomY, w, GROUND - bottomY, 4);

    // Highlight strip
    ctx.fillStyle = "rgba(220,235,235,.20)";
    ctx.fillRect(x + 10, 5, 7, Math.max(0, p.top - 10));
    ctx.fillRect(x + 10, bottomY + 5, 7, Math.max(0, GROUND - bottomY - 10));

    // Caps / collars
    ctx.fillStyle = "#344249";
    roundedRect(x - 7, p.top - 25, w + 14, 25, 5);
    roundedRect(x - 7, bottomY, w + 14, 25, 5);

    ctx.fillStyle = "rgba(235,245,245,.18)";
    ctx.fillRect(x - 2, p.top - 20, w + 4, 5);
    ctx.fillRect(x - 2, bottomY + 4, w + 4, 5);
}

function drawPipes() {
    for (const p of pipes) drawPipe(p);
}

function drawGround() {
    ctx.fillStyle = "#171b1d";
    ctx.fillRect(0, GROUND, W, H - GROUND);

    ctx.fillStyle = "#414b49";
    ctx.fillRect(0, GROUND, W, 9);

    ctx.fillStyle = "#69736c";
    for (let x = -((frame * 2.5) % 34); x < W; x += 34) {
        ctx.fillRect(x, GROUND + 20, 18, 3);
    }

    ctx.fillStyle = "rgba(255,210,140,.10)";
    ctx.fillRect(0, GROUND + 9, W, 2);
}

function drawCat() {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.rotation);

    const bob = Math.sin(frame * 0.22) * 1.5;
    const scaleY = player.squash + (1 - player.squash) * 0.2;

    // Soft shadow/glow around cat
    ctx.globalAlpha = .22;
    ctx.filter = "blur(5px)";
    ctx.drawImage(
        cat,
        -player.w / 2 + 3,
        -player.h / 2 + 6,
        player.w,
        player.h
    );
    ctx.filter = "none";
    ctx.globalAlpha = 1;

    // Flight animation: gentle squash/stretch + tilt
    ctx.translate(0, bob);
    ctx.scale(1 / scaleY, scaleY);

    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(
        cat,
        -player.w / 2,
        -player.h / 2,
        player.w,
        player.h
    );

    ctx.restore();

    player.squash += (1 - player.squash) * 0.18;
}

function drawParticles() {
    for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.life > .45 ? "#f0d59b" : "#a76f55";
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
    }
}

function drawScore() {
    ctx.textAlign = "center";

    // Score pill
    ctx.fillStyle = "rgba(8,12,18,.38)";
    roundedRect(W / 2 - 62, 18, 124, 58, 18);

    ctx.fillStyle = "#f3e8ca";
    ctx.font = "bold 34px Arial";
    ctx.fillText(score, W / 2, 55);

    ctx.fillStyle = "rgba(243,232,202,.72)";
    ctx.font = "11px Arial";
    ctx.letterSpacing = "2px";
    ctx.fillText("SCORE", W / 2, 30);
}

function drawButton(x, y, w, h, label, active = true) {
    ctx.fillStyle = active ? "rgba(224,205,163,.16)" : "rgba(255,255,255,.08)";
    roundedRect(x, y, w, h, 13);
    ctx.strokeStyle = "rgba(224,205,163,.30)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = "#f1e6ca";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "center";
    ctx.fillText(label, x + w / 2, y + h / 2 + 6);
}

function drawMenu() {
    ctx.fillStyle = "rgba(5,8,12,.48)";
    ctx.fillRect(35, 165, 410, 300);

    ctx.fillStyle = "#f1e6ca";
    ctx.textAlign = "center";
    ctx.font = "bold 46px Arial";
    ctx.fillText("FLAPPY CAT", W / 2, 235);

    ctx.fillStyle = "rgba(241,230,202,.68)";
    ctx.font = "16px Arial";
    ctx.fillText("a quiet little flight through the night", W / 2, 265);

    const pulse = 1 + Math.sin(menuPulse) * .025;
    ctx.save();
    ctx.translate(W / 2, 337);
    ctx.scale(pulse, pulse);
    drawButton(-95, -25, 190, 50, "PLAY");
    ctx.restore();

    ctx.fillStyle = "rgba(241,230,202,.60)";
    ctx.font = "13px Arial";
    ctx.fillText("SPACE / ↑ / CLICK", W / 2, 414);
    ctx.fillText("Best score: " + best, W / 2, 438);
}

function drawPause() {
    ctx.fillStyle = "rgba(5,8,12,.55)";
    ctx.fillRect(65, 235, 350, 150);

    ctx.fillStyle = "#f1e6ca";
    ctx.textAlign = "center";
    ctx.font = "bold 40px Arial";
    ctx.fillText("PAUSED", W / 2, 295);

    ctx.font = "16px Arial";
    ctx.fillStyle = "rgba(241,230,202,.7)";
    ctx.fillText("Press P or tap the pause button", W / 2, 330);
}

function drawGameOver() {
    ctx.fillStyle = "rgba(5,8,12,.58)";
    ctx.fillRect(48, 175, 384, 300);

    ctx.fillStyle = "#f1e6ca";
    ctx.textAlign = "center";
    ctx.font = "bold 42px Arial";
    ctx.fillText("FLIGHT ENDED", W / 2, 240);

    ctx.fillStyle = "rgba(241,230,202,.68)";
    ctx.font = "15px Arial";
    ctx.fillText("the night caught you this time", W / 2, 268);

    ctx.fillStyle = "#f1e6ca";
    ctx.font = "bold 26px Arial";
    ctx.fillText("SCORE  " + score, W / 2, 318);

    ctx.fillStyle = "rgba(241,230,202,.70)";
    ctx.font = "16px Arial";
    ctx.fillText("BEST  " + best, W / 2, 345);

    drawButton(W / 2 - 95, 375, 190, 50, "FLY AGAIN");
}

function drawPauseButton() {
    if (state === "menu" || state === "gameover") return;

    ctx.fillStyle = "rgba(8,12,18,.46)";
    roundedRect(418, 20, 42, 42, 12);

    ctx.fillStyle = "#f1e6ca";
    ctx.fillRect(431, 32, 5, 18);
    ctx.fillRect(442, 32, 5, 18);
}

function draw() {
    drawBackground();
    drawPipes();
    drawGround();
    drawCat();
    drawParticles();
    drawScore();
    drawPauseButton();

    if (state === "menu") drawMenu();
    if (state === "paused") drawPause();
    if (state === "gameover") drawGameOver();
}

// ---------- Input ----------
function insidePause(x, y) {
    return x >= 410 && x <= 470 && y >= 12 && y <= 72;
}

function canvasPoint(e) {
    const r = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - r.left) * W / r.width,
        y: (e.clientY - r.top) * H / r.height
    };
}

canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    startAudio();

    const p = canvasPoint(e);

    if (state === "playing" || state === "paused") {
        if (insidePause(p.x, p.y)) {
            pauseGame();
            return;
        }
    }

    if (state === "menu") {
        if (p.x > 140 && p.x < 340 && p.y > 305 && p.y < 390) {
            startGame();
        }
        return;
    }

    if (state === "gameover") {
        if (p.x > 140 && p.x < 340 && p.y > 360 && p.y < 450) {
            startGame();
        }
        return;
    }

    if (state === "paused") return;

    flap();
});

window.addEventListener("keydown", e => {
    if (e.code === "KeyP") {
        if (state === "playing" || state === "paused") {
            pauseGame();
        }
        return;
    }

    if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();

        if (state === "menu") startGame();
        else if (state === "gameover") startGame();
        else if (state === "playing") flap();
    }

    if (e.code === "Escape" && (state === "playing" || state === "paused")) {
        pauseGame();
    }
});

// ---------- Loop ----------
function update(dt) {
    menuPulse += dt * 0.003;

    if (state === "playing") {
        frame += dt / 16.67;

        player.vy += 0.48 * dt / 16.67;
        player.y += player.vy * dt / 16.67;

        player.rotation = Math.max(
            -0.35,
            Math.min(0.9, player.vy * 0.055)
        );

        updatePipes(dt);

        pipeTimer += dt;
        if (pipeTimer >= 1450) {
            pipeTimer = 0;
            createPipe();
        }

        if (pipeCollision()) gameOver();
    }

    if (state === "gameover") {
        updateParticles(dt);
        player.vy += 0.25 * dt / 16.67;
        player.y += player.vy * dt / 16.67;
        player.rotation += 0.025 * dt / 16.67;
    }
}

function loop(time) {
    const dt = Math.min(lastTime ? time - lastTime : 16.67, 50);
    lastTime = time;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
